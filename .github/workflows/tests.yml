---
name: tests

# The kernel is torch-only (no sim boot), so the unit suite runs on a bare CPU
# runner. Bare `pytest` already deselects the integration/sitl tiers (pyproject
# addopts) — those need a GPU / a PX4 build and stay local. This mirrors the
# README's own quick-start command exactly: `uv sync` + `uv run pytest -q`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Kernel unit suite
        run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.12"
          args: check
